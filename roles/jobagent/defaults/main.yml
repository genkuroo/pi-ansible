---
jobagent_repo: git@github-jobagent:genkuroo/job-agent.git
jobagent_version: main
# Test hook: a `git bundle` file on the control machine (your Mac). When set,
# the role clones from it instead of GitHub, so a throwaway VM can be tested
# without the deploy key. Leave unset on real Pis.
jobagent_repo_bundle: ""

jobagent_home: "{{ ansible_facts['user_dir'] }}"
jobagent_dir: "{{ jobagent_home }}/job-agent"
jobagent_conf_dir: "{{ jobagent_home }}/.config/jobagent"
jobagent_units_dir: "{{ jobagent_home }}/.config/systemd/user"
jobagent_deploy_key: "{{ jobagent_home }}/.ssh/jobagent_deploy"
# Need no secrets (no Claude, no Discord), so they always run.
jobagent_always_units:
  - jobagent-board.timer
  - jobagent-board-check.timer
  - jobagent-web.service
# Call Claude and post to Discord: only started once the env file has secrets.
jobagent_timers:
  - jobagent.timer
  - jobagent-scout.timer
  - jobagent-summary.timer
