# Which machines exist and how to reach them. Grouped by what they run,
# so a playbook can target "jobagent" instead of a hostname.
all:
  children:
    pis:
      hosts:
        pi500:
          ansible_host: pi500         # Tailscale (MagicDNS); pi500.local also works on the home LAN
          ansible_user: ethan
        homelab:
          # Pi 400, over Tailscale. `homelab` is an alias in ~/.ssh/config
          # that points at its tailnet name, which stays out of this repo.
          ansible_host: homelab
          ansible_user: genkuro
    jobagent:
      hosts:
        pi500:
    minecraft:
      hosts:
        pi500:
    docker_stack:
      hosts:
        homelab:
