[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Pis get reflashed; a fresh OS means a new SSH host key. Keep checking keys,
# but fix a reflash with `ssh-keygen -R <host>` rather than disabling checks.
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
